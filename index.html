<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avalie seu filme aqui</title>
  <!-- Google Fonts para tipografia moderna -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>CineTech</h1>
    <p class="subtitle">Consulte e avalie seus filmes favoritos</p>
    <div class="search-bar">
      <input type="text" id="inputFilme" placeholder="Digite o nome do filme (em inglês)...">
      <button id="btnBuscar">Buscar</button>
    </div>
  </header>

  <main>
    <!-- O JavaScript vai injetar o cartão do filme aqui dentro -->
    <section id="movie-container">
      <p class="initial-msg">Faça uma busca para ver os resultados.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
